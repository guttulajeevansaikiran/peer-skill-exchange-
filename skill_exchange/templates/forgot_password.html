<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Shadow System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 20%, rgba(91, 43, 170, 0.25), transparent 35%),
                linear-gradient(135deg, #020207, #090614 50%, #020207);
            color: white;
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Moon */

        .moon {
            position: absolute;
            top: 7%;
            right: 10%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #aaa9c8);
            box-shadow:
                0 0 30px rgba(180, 170, 255, 0.5),
                0 0 80px rgba(100, 70, 200, 0.25);
            animation: moonFloat 5s ease-in-out infinite;
        }

        .moon::after {
            content: "";
            position: absolute;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #05040b;
            top: -5px;
            left: 22px;
        }

        /* Background glow */

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(109, 40, 217, 0.18),
                transparent 70%
            );
            filter: blur(10px);
            animation: glowPulse 4s ease-in-out infinite;
        }

        /* Particles */

        .particles span {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #bda8ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #8b5cf6;
            animation: particleMove 7s linear infinite;
        }

        .particles span:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-delay: 0s;
        }

        .particles span:nth-child(2) {
            left: 20%;
            top: 70%;
            animation-delay: 2s;
        }

        .particles span:nth-child(3) {
            left: 75%;
            top: 25%;
            animation-delay: 1s;
        }

        .particles span:nth-child(4) {
            left: 85%;
            top: 70%;
            animation-delay: 3s;
        }

        .particles span:nth-child(5) {
            left: 45%;
            top: 15%;
            animation-delay: 4s;
        }

        .particles span:nth-child(6) {
            left: 55%;
            top: 85%;
            animation-delay: 2.5s;
        }

        /* Card */

        .card {
            position: relative;
            width: 430px;
            max-width: 100%;
            padding: 42px 35px;
            background: rgba(7, 5, 18, 0.88);
            border: 1px solid rgba(139, 92, 246, 0.45);
            border-radius: 20px;
            box-shadow:
                0 0 25px rgba(124, 58, 237, 0.25),
                inset 0 0 30px rgba(124, 58, 237, 0.05);
            backdrop-filter: blur(15px);
            animation: cardEnter 0.8s ease;
            z-index: 5;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(
                120deg,
                transparent,
                #8b5cf6,
                transparent,
                #6366f1,
                transparent
            );
            background-size: 300% 300%;
            animation: borderMove 5s linear infinite;
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Logo */

        .logo {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo-symbol {
            width: 70px;
            height: 70px;
            margin: auto;
            border: 2px solid #8b5cf6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow:
                0 0 15px rgba(139, 92, 246, 0.7),
                inset 0 0 15px rgba(139, 92, 246, 0.25);
            animation: logoPulse 2.5s ease-in-out infinite;
        }

        .system {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #9ca3af;
        }

        h1 {
            text-align: center;
            margin-top: 10px;
            font-size: 30px;
            letter-spacing: 2px;
            background: linear-gradient(
                90deg,
                #ffffff,
                #c4b5fd,
                #8b5cf6,
                #ffffff
            );
            background-size: 250%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s linear infinite;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.6;
        }

        /* Flash */

        .flash {
            margin-top: 22px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            color: #fca5a5;
            background: rgba(127, 29, 29, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.3);
            font-size: 13px;
        }

        /* Form */

        form {
            margin-top: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c4b5fd;
            font-size: 13px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.35);
            outline: none;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow:
                0 0 15px rgba(139, 92, 246, 0.3),
                inset 0 0 10px rgba(139, 92, 246, 0.05);
            transform: translateY(-1px);
        }

        /* Button */

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            background: linear-gradient(
                90deg,
                #6d28d9,
                #8b5cf6,
                #4f46e5,
                #6d28d9
            );
            background-size: 300% 100%;
            box-shadow:
                0 0 18px rgba(124, 58, 237, 0.35);
            animation: buttonGradient 4s linear infinite;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 30px rgba(139, 92, 246, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Back */

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #a78bfa;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back:hover {
            color: white;
            text-shadow: 0 0 10px #8b5cf6;
        }

        /* Animations */

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes moonFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        @keyframes logoPulse {
            0%, 100% {
                box-shadow:
                    0 0 15px rgba(139, 92, 246, 0.5),
                    inset 0 0 15px rgba(139, 92, 246, 0.2);
            }

            50% {
                box-shadow:
                    0 0 35px rgba(139, 92, 246, 0.9),
                    inset 0 0 20px rgba(139, 92, 246, 0.35);
            }
        }

        @keyframes titleGlow {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 250%;
            }
        }

        @keyframes borderMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes particleMove {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120px);
                opacity: 0;
            }
        }

        @keyframes buttonGradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        /* Mobile */

        @media (max-width: 600px) {
            .moon {
                width: 80px;
                height: 80px;
                right: 5%;
            }

            .moon::after {
                width: 70px;
                height: 70px;
            }

            .card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="glow"></div>
        <div class="moon"></div>

        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="card">

            <div class="logo">
                <div class="logo-symbol">⚔</div>
            </div>

            <div class="system">
                SHADOW SYSTEM
            </div>

            <h1>FORGOT PASSWORD</h1>

            <p class="subtitle">
                Enter your registered username and email
                to begin the recovery process.
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="input-group">
                    <label for="username">USERNAME</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">EMAIL</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <button type="submit">
                    ⚡ RECOVER PASSWORD
                </button>

            </form>

            <a href="{{ url_for('login') }}" class="back">
                ← Back to Login
            </a>

        </div>

    </div>

</body>
</html>
