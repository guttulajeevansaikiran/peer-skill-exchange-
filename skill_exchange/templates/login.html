<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillExchange</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(3, 4, 12, 0.88),
                    rgba(3, 4, 12, 0.94)
                ),
                url("https://i.pinimg.com/736x/5c/b1/06/5cb10609093b4aadc788f0db7b2ac5e8.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 470px;
            padding: 25px;
        }

        .login-card {
            padding: 42px;

            border-radius: 24px;

            background: rgba(13, 14, 25, 0.88);

            border: 1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.55),
                0 0 50px rgba(105, 84, 255, 0.08);

            backdrop-filter: blur(12px);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .logo span {
            color: #8d76ff;
        }

        .subtitle {
            text-align: center;
            color: #85859a;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bcbccc;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.045);

            color: white;

            outline: none;

            font-size: 16px;
        }

        input:focus {
            border-color: #8570ff;

            box-shadow:
                0 0 18px rgba(117, 94, 255, 0.16);
        }

        input::placeholder {
            color: #686879;
        }

        .login-btn {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #705cff,
                    #9b7dff
                );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(111, 87, 255, 0.25);
        }

        .message {
            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }

        .error {
            background: rgba(255, 70, 70, 0.10);
            border: 1px solid rgba(255, 70, 70, 0.22);
            color: #ff9b9b;
        }

        .success {
            background: rgba(70, 255, 150, 0.08);
            border: 1px solid rgba(70, 255, 150, 0.20);
            color: #8dffbd;
        }

        .links {
            margin-top: 24px;
            text-align: center;
        }

        .links a {
            color: #9a87ff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 8px;
            font-size: 13px;
        }

        @media (max-width: 550px) {

            .login-card {
                padding: 30px 22px;
            }

            .logo {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            Skill<span>Exchange</span>
        </div>

        <div class="subtitle">
            Enter the Shadow System
        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message
                        {% if category == 'error' %}
                            error
                        {% else %}
                            success
                        {% endif %}
                    ">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="login">
                    Email or Username
                </label>

                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Enter email or username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <a
                    href="{{ url_for('forgot_password') }}"
                    class="forgot"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                LOGIN
            </button>

        </form>


        <div class="links">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </div>

</div>

</body>
</html>
